version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: propagent_dev
      POSTGRES_USER: propagent
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
