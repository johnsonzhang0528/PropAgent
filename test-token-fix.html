<!DOCTYPE html>
<html>
<head>
    <title>Token修復測試</title>
</head>
<body>
    <h1>PropAgent Pro Token修復測試</h1>
    <button onclick="simulateLogin()">模擬登錄</button>
    <button onclick="testTokenRetrieval()">測試Token獲取</button>
    <button onclick="clearStorage()">清空存儲</button>
    <pre id="output"></pre>

    <script>
        function log(message) {
            document.getElementById('output').textContent += message + '\n';
        }

        function simulateLogin() {
            // 模擬登錄成功後的token存儲
            const testToken = 'test-token-' + Date.now();
            const testUser = {
                id: '688f2067a1a2f8c53a93a328',
                email: 'test@example.com',
                name: 'Test User'
            };
            
            localStorage.setItem('access_token', testToken);
            localStorage.setItem('user', JSON.stringify(testUser));
            
            log('✅ 模擬登錄完成');
            log('Token: ' + testToken);
            log('User: ' + JSON.stringify(testUser));
        }

        function testTokenRetrieval() {
            // 測試token獲取邏輯（模擬TasksPage的邏輯）
            const reduxToken = null; // 模擬Redux中沒有token的情況
            const localStorageToken = localStorage.getItem('access_token');
            const finalToken = reduxToken || localStorageToken;
            
            log('\n📋 Token獲取測試結果:');
            log('Redux Token: ' + (reduxToken || 'null'));
            log('LocalStorage Token: ' + (localStorageToken || 'null'));
            log('Final Token: ' + (finalToken || 'null'));
            log('Has Token: ' + !!finalToken);
            log('Token Length: ' + (finalToken ? finalToken.length : 'undefined'));
            
            if (finalToken) {
                log('✅ Token獲取成功！修復有效');
            } else {
                log('❌ Token獲取失敗');
            }
        }

        function clearStorage() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            localStorage.removeItem('refresh_token');
            log('\n🗑️ 存儲已清空');
        }

        // 頁面載入時自動測試
        window.onload = function() {
            log('🚀 Token修復測試開始');
            log('當前時間: ' + new Date().toLocaleString());
        };
    </script>
</body>
</html>
