<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics 測試頁面</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PropAgent Pro Analytics 診斷測試</h1>
        
        <div class="test-section">
            <h2>1. 前端連接測試</h2>
            <div id="frontend-status">測試中...</div>
        </div>
        
        <div class="test-section">
            <h2>2. API 連接測試</h2>
            <div id="api-status">測試中...</div>
        </div>
        
        <div class="test-section">
            <h2>3. 圖表庫測試</h2>
            <div id="recharts-status">測試中...</div>
        </div>
        
        <div class="test-section">
            <h2>4. 模擬 API 數據測試</h2>
            <div id="mock-data-status">測試中...</div>
            <div id="chart-container" style="width: 100%; height: 300px; border: 1px solid #ccc; margin-top: 10px;"></div>
        </div>
        
        <div class="test-section">
            <h2>5. 控制台錯誤日誌</h2>
            <pre id="console-log"></pre>
        </div>
    </div>

    <script>
        // 捕獲控制台錯誤
        const originalConsoleError = console.error;
        const errorLogs = [];
        console.error = function(...args) {
            errorLogs.push(args.join(' '));
            originalConsoleError.apply(console, args);
            updateConsoleLog();
        };

        function updateConsoleLog() {
            document.getElementById('console-log').textContent = errorLogs.join('\n');
        }

        // 測試1: 前端連接
        function testFrontend() {
            try {
                document.getElementById('frontend-status').innerHTML = '<span class="success">✓ 前端頁面載入正常</span>';
            } catch (error) {
                document.getElementById('frontend-status').innerHTML = `<span class="error">✗ 前端錯誤: ${error.message}</span>`;
            }
        }

        // 測試2: API 連接
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:3000/api/health');
                if (response.ok) {
                    document.getElementById('api-status').innerHTML = '<span class="success">✓ API 服務正常</span>';
                } else {
                    document.getElementById('api-status').innerHTML = `<span class="error">✗ API 錯誤: ${response.status}</span>`;
                }
            } catch (error) {
                document.getElementById('api-status').innerHTML = `<span class="error">✗ API 連接失敗: ${error.message}</span>`;
            }
        }

        // 測試3: Recharts 庫
        function testRecharts() {
            try {
                // 檢查是否可以從 CDN 載入 Recharts
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/recharts@2.8.0/lib/index.js';
                script.onload = () => {
                    document.getElementById('recharts-status').innerHTML = '<span class="success">✓ Recharts 庫載入成功</span>';
                    createMockChart();
                };
                script.onerror = () => {
                    document.getElementById('recharts-status').innerHTML = '<span class="error">✗ Recharts 庫載入失敗</span>';
                };
                document.head.appendChild(script);
            } catch (error) {
                document.getElementById('recharts-status').innerHTML = `<span class="error">✗ Recharts 測試錯誤: ${error.message}</span>`;
            }
        }

        // 測試4: 模擬圖表數據
        function createMockChart() {
            const mockData = [
                { status: 'active', count: 45 },
                { status: 'inactive', count: 23 },
                { status: 'completed', count: 67 },
                { status: 'lost', count: 12 }
            ];
            
            document.getElementById('mock-data-status').innerHTML = `
                <span class="success">✓ 模擬數據創建成功</span>
                <pre>${JSON.stringify(mockData, null, 2)}</pre>
            `;
            
            // 簡單的 Canvas 圖表測試
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            
            // 繪製簡單的柱狀圖
            const colors = ['#52c41a', '#faad14', '#1890ff', '#ff4d4f'];
            mockData.forEach((item, index) => {
                const x = index * 80 + 50;
                const height = item.count * 2;
                ctx.fillStyle = colors[index];
                ctx.fillRect(x, 200 - height, 60, height);
                ctx.fillStyle = 'black';
                ctx.fillText(item.status, x, 220);
                ctx.fillText(item.count, x, 200 - height - 5);
            });
            
            document.getElementById('chart-container').appendChild(canvas);
        }

        // 執行所有測試
        testFrontend();
        testAPI();
        testRecharts();
        
        // 模擬Analytics組件錯誤檢測
        setTimeout(() => {
            document.getElementById('mock-data-status').innerHTML += '<br><span class="info">正在檢測 Analytics 組件問題...</span>';
            
            // 檢查常見問題
            const problems = [];
            
            // 檢查1: recharts 依賴
            if (!window.Recharts && !window.recharts) {
                problems.push('Recharts 庫可能未正確載入');
            }
            
            // 檢查2: 數據格式
            const invalidData = [null, undefined, [], {}];
            problems.push('檢測到可能的空數據問題');
            
            if (problems.length > 0) {
                document.getElementById('mock-data-status').innerHTML += 
                    '<br><span class="error">發現問題:</span><ul>' + 
                    problems.map(p => `<li>${p}</li>`).join('') + 
                    '</ul>';
            }
        }, 2000);
    </script>
</body>
</html>
